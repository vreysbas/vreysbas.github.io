<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Conga Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin">
  <div class="bg-noise"></div>
  <header class="topbar">
    <div class="brand">Conga Shop Admin</div>
    <nav>
      <a href="index.html" class="ghost-btn link-btn">Terug naar shop</a>
    </nav>
  </header>

  <main class="admin-layout">
    <section id="adminLoginSection" class="modal-card admin-card gate-card">
      <h3>Admin Login</h3>
      <form id="adminLoginForm" class="form-grid">
        <label>Username
          <input name="username" required>
        </label>
        <label>Password
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="primary-btn">Inloggen</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <header class="admin-header">
        <h2>Admin Dashboard</h2>
        <div class="actions-row">
          <button id="exportOrdersBtn" class="ghost-btn">Download Excel (CSV)</button>
          <button id="logoutAdminBtn" class="ghost-btn">Uitloggen</button>
        </div>
      </header>

      <div class="kpi-grid">
        <article class="kpi-card"><p>Bestellingen</p><h3 id="kpiOrders">0</h3></article>
        <article class="kpi-card"><p>Omzet</p><h3>EUR <span id="kpiRevenue">0.00</span></h3></article>
        <article class="kpi-card"><p>Betaald</p><h3>EUR <span id="kpiPaid">0.00</span></h3></article>
        <article class="kpi-card"><p>Klanten</p><h3 id="kpiCustomers">0</h3></article>
      </div>

      <article class="table-card">
        <h3>Orders</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Klant</th>
                <th>E-mail</th>
                <th>Adres</th>
                <th>Items</th>
                <th>Totaal</th>
                <th>Betaald</th>
                <th>Status</th>
                <th>Methode</th>
                <th>Referentie</th>
                <th>Tijdstip</th>
              </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
